<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span style="display:flex; gap:6px;">
      <svg width="14" height="10" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="18" height="14" rx="2"/><rect x="21" y="5" width="2" height="6"/></svg>
    </span>
  </div>

  <!-- Onboarding -->
  <section id="screen-onboarding" class="screen hidden">
    <div class="onboard-body">
      <h2 class="title-lg">Choose your habits</h2>
      <div class="subtitle">Pick what you want to build. You can change these later.</div>
      <div id="chip-grid" class="chip-grid"></div>
      <div class="selected-count-row"><span id="selected-count">0 selected</span></div>
      <button type="button" id="btn-finish" class="btn btn-primary btn-block" disabled>Continue</button>
    </div>
  </section>

  <!-- Detail -->
  <section id="screen-detail" class="screen hidden">
    <div class="detail-header">
      <span id="btn-back" class="backbtn">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,1,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,1,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
      </span>
    </div>
    <div class="scroll" id="detail-body"></div>
  </section>

  <!-- Tab screens -->
  <section id="screen-tabs" class="screen hidden">
    <div class="scroll" id="tab-today" style="flex:1;"></div>
    <div class="scroll hidden" id="tab-stats" style="flex:1;"></div>
    <div class="scroll hidden" id="tab-reminders" style="flex:1;"></div>

    <div class="tabbar">
      <button type="button" class="tabbtn" data-tab="today">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z"/></svg>
        <span>Today</span>
      </button>
      <button type="button" class="tabbtn" data-tab="stats">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M232,208a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8V48a8,8,0,0,1,16,0v99.06L90.42,98.11a8,8,0,0,1,11-.4l57,49.71,68.32-68.32a8,8,0,1,1,11.32,11.32l-72,72a8,8,0,0,1-11,.4l-57-49.71L40,164.63V200H224A8,8,0,0,1,232,208Z"/></svg>
        <span>Stats</span>
      </button>
      <button type="button" class="tabbtn" data-tab="reminders">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216Z"/></svg>
        <span>Reminders</span>
      </button>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
